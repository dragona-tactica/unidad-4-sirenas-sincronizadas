<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sirenas: Canto de Fase</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #030b18;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        color: #cfe8ff;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: rgba(3, 11, 24, 0.55);
        padding: 10px 14px;
        border-radius: 8px;
        max-width: 260px;
      }
      #hud label { display: flex; flex-direction: column; gap: 2px; }
      #hud input[type="range"] { width: 100%; }
      #start-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(3, 11, 24, 0.9);
        color: #cfe8ff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="start-overlay">Toca para despertar el canto de las sirenas</div>
    <div id="hud">
      <label>
        Marea (K)
        <input type="range" id="kSlider" min="0" max="12" step="0.05" value="0.5" />
      </label>
      <div id="stateLabel">Estado: —</div>
      <div style="opacity:0.7; font-size:11px;">
        Clic en una sirena: Grito de Ulises · Arrastrarla: mover un poco su sitio · Clic en el mar: lanzar piedra
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
